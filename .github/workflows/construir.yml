name: Construir la página

on:
  push:
    branches: [main]
    paths:
      - 'datos/**'
      - 'herramientas/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: construir
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas
        working-directory: herramientas
        run: |
          python3 test_cifras.py
          python3 test_acordes.py
          python3 test_agente.py
      - name: Generar index.html
        run: python3 herramientas/construir.py
      - name: Guardar si cambió
        run: |
          if git diff --quiet -- index.html herramientas/acordes_cache.json; then
            echo "La página ya estaba al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html herramientas/acordes_cache.json
          git commit -m "Regenera index.html"
          git pull --rebase origin main
          git push
